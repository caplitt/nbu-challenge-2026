# Параметри QPM — перенесено з nbu_template/model/param.m
# Змінюйте тут; model/model.model читає ці значення за іменами.

# Перемикачі режиму монетарної політики
alpha: 1      # 1 = ставка за правилом Тейлора, 0 = ставка за UIP
beta: 0.7     # контроль НБУ над курсом: 0 = вільне плавання, 1 = повністю керований курс

# Стаціонарні стани (steady states), % річних
# Темпи в моделі — 100·ln-різниці (як у QPM НБУ); у звітах — звичайні % р/р. Тому ціль задано як 100·ln(1,05),
# щоб «5%» у таблицях означало саме 5% р/р (у шаблоні НБУ — 5, що відповідає ≈5,13% р/р).
dl_cpi_tar: 4.879     # ціль з інфляції НБУ: 5% р/р
dl_rer_tnd_ss: -2     # тренд реального курсу (від'ємне = реальне зміцнення гривні)
dl_gdp_tnd_ss: 2      # потенційне зростання ВВП
prem_uip_tnd_ss: 4    # премія за ризик (суверенна)

coef: 1               # реакція ставки на відхилення прогнозу інфляції від цілі

dl_cpi_ea_tar: 1.980  # ціль ЄЦБ: 2% р/р = 100·ln(1,02)
rir_ea_tnd_ss: 1      # нейтральна реальна ставка в єврозоні

# Розширення команди: канал цін на енергоносії в кривій Філіпса (калібрування — docs/methodology.md)
# Імпортовані енергоносії в небазовій відносній ціні: +20% реальної ціни нафти -> рівень ІСЦ ≈+0,35%
# (вага пального ≈4% × частка нафти в роздрібній ціні ≈0,4 × 20% ≈ 0,3% + непрямі ефекти; НБУ: пальне ≈+0,3 в. п.)
w_oil: 0.016

# Стандартні відхилення шоків (у MATLAB-шаблоні: p.std_*).
# Шоки, яких тут немає, мають std = 1 (так IRIS робить для лінійних моделей).
# Де ці std працюють: лише у фільтрі Калмана — як відносні ваги, за якими дані розкладаються між шоками (і для
# початкового розподілу). На прогноз вони не впливають (шоки там задаються планом), а віяло невизначеності бере
# емпіричні std згладжених шоків за 2023–2026 (qpm/uncertainty.py), бо калібровані значення шаблону в рази менші
# за фактичну воєнну волатильність (наприклад, шок попиту: 0,5 проти ≈2,6).
# res_dl_cpi_c — шок базової інфляції (std як у шаблонного шоку ІСЦ, 1);
# res_dl_rnc — шок відносної ціни небазових товарів (продовольство, тарифи, пальне) — волатильніший;
# res_dl_roil — шок реальної ціни нафти: нафта спостережувана (L_ROIL) і єдиний шок у своєму рівнянні, тож фільтр
#   відновлює його з даних за будь-якого std (std входить лише в початкову коваріацію стану — вплив на перші квартали
#   мізерний); значення = округлене емпіричне std за 2016–2026 (річні 100·ln-різниці), щоб параметр не вводив в оману
#   (до аудиту 25.10.2026 стояла 1).
std:
  res_dl_cpi_c: 1
  res_dl_rnc: 2
  res_ir_tlr: 1
  res_ir_uip: 1
  res_l_gdp_gap: 0.5
  res_dl_gdp_tnd: 0.25
  res_l_gdp_tnd: 0
  res_l_er_uip: 2.5
  res_dl_er_tar: 0.25
  res_dl_rer_tnd: 0.25
  res_l_rer_tnd: 0
  res_prem_uip_gap: 1.5
  res_ir_ea: 1
  res_dl_cpi_ea: 1
  res_l_gdp_ea_gap: 1
  res_dl_roil: 60
