# Параметри QPM — перенесено з nbu_template/model/param.m
# Змінюйте тут; model/model.model читає ці значення за іменами.

# Перемикачі режиму монетарної політики
alpha: 1      # 1 = ставка за правилом Тейлора, 0 = ставка за UIP
beta: 0.7     # контроль НБУ над курсом: 0 = вільне плавання, 1 = повністю керований курс

# Стаціонарні стани (steady states), % річних
dl_cpi_tar: 5         # ціль з інфляції НБУ
dl_rer_tnd_ss: -2     # тренд реального курсу (від'ємне = реальне зміцнення гривні)
dl_gdp_tnd_ss: 2      # потенційне зростання ВВП
prem_uip_tnd_ss: 4    # премія за ризик (суверенна)

coef: 1               # реакція ставки на відхилення прогнозу інфляції від цілі

dl_cpi_ea_tar: 2      # ціль ЄЦБ
rir_ea_tnd_ss: 1      # нейтральна реальна ставка в єврозоні

# Стандартні відхилення шоків (у MATLAB-шаблоні: p.std_*).
# Шоки, яких тут немає, мають std = 1 (так IRIS робить для лінійних моделей).
# Примітка: у param.m стояло "std_res_dl_cpi_c" (з помилкою в імені), тому IRIS
# брав для res_dl_cpi значення за замовчуванням, тобто 1. Тут те саме значення.
std:
  res_dl_cpi: 1
  res_ir_tlr: 1
  res_ir_uip: 1
  res_l_gdp_gap: 0.5
  res_dl_gdp_tnd: 0.25
  res_l_gdp_tnd: 0
  res_l_er_uip: 2.5
  res_dl_er_tar: 0.25
  res_dl_rer_tnd: 0.25
  res_l_rer_tnd: 0
  res_prem_uip_gap: 1.5
  res_ir_ea: 1
  res_dl_cpi_ea: 1
  res_l_gdp_ea_gap: 1
